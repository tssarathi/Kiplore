name: ci

on:
  push:
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f agent/Dockerfile -t kiplore-agent .
      # Building only proves it compiles. This proves the worker can still find the
      # story library, which is decided by the layout of the image.
      - name: the library resolves inside the image
        run: |
          docker run --rm kiplore-agent python -c \
            "from narrator.config import LIBRARY_DIR; assert LIBRARY_DIR.is_dir(), LIBRARY_DIR"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Next generates the route and layout prop types, so tsc cannot run before it.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint app lib components
      - run: npm test
      - run: npm run build
