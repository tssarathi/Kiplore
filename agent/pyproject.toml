[project]
name = "narrator"
version = "0.1.0"
description = "Kiplore's voice agent: narrates a story into a room and answers in the same voice"
authors = [
    { name = "Sarathi Thirumalai Soundararajan", email = "tssarathi5901@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "boto3>=1.43.87",
    "livekit-agents[deepgram]>=1.7.1",
    "livekit-plugins-noise-cancellation>=0.3.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

