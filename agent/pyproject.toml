[project]
name = "narrator"
version = "0.1.0"
description = "Kiplore's voice agent: narrates a story into a room and answers in the same voice"
authors = [
    { name = "Sarathi Thirumalai Soundararajan", email = "tssarathi5901@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "boto3>=1.43.87",
    "livekit-agents[deepgram]>=1.7.1",
    "livekit-plugins-noise-cancellation>=0.3.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.pyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

